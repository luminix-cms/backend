name: CI

on:
  push:
    branches: [v1.x]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 11 (PHP 8.2 - 8.4)
          - laravel: "^11.0"
            testbench: "^9.0"
            php: "8.2"
          - laravel: "^11.0"
            testbench: "^9.0"
            php: "8.3"
          - laravel: "^11.0"
            testbench: "^9.0"
            php: "8.4"
          # Laravel 12 (PHP 8.2 - 8.5)
          - laravel: "^12.0"
            testbench: "^10.0"
            php: "8.2"
          - laravel: "^12.0"
            testbench: "^10.0"
            php: "8.3"
          - laravel: "^12.0"
            testbench: "^10.0"
            php: "8.4"
          - laravel: "^12.0"
            testbench: "^10.0"
            php: "8.5"
          # Laravel 13 (PHP 8.3 - 8.5)
          - laravel: "^13.0"
            testbench: "^11.0"
            php: "8.3"
          - laravel: "^13.0"
            testbench: "^11.0"
            php: "8.4"
          - laravel: "^13.0"
            testbench: "^11.0"
            php: "8.5"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Laravel and Testbench versions
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: composer test

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        uses: paulhatch/semantic-version@v5.4.0
        id: semver
        with:
          tag_prefix: ''

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
